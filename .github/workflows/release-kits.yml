# Release scheduled kits.
#
# Generated by OPS/landing/materials/materials.py (stage-code copies this file
# verbatim); edit it there, never in this repository. Tested locally against a
# fake repo and a mocked `gh`: OPS/tests/test_release_workflow.py.
#
# A kit waiting for its day is a DRAFT release: invisible to the public, assets
# included. Its body carries `<!-- release_at: <ISO 8601 with offset> -->` and it
# holds kit-src.tar.gz (the kit folder, plus optionally `_root/` with the root
# README / DATA_LICENSE / CITATION as they must read once it is live). On the
# first run after that moment this workflow copies the folder onto main, deletes
# kit-src.tar.gz and publishes the release with the gated data files. The kit
# page on learngeodata.eu goes live at the same moment through WordPress's own
# scheduling. Nothing on anyone's machine is involved on the day.
#
# Safety: a draft without the marker, with a tag that is not a kit slug, or with
# an unreadable date is never touched. A due draft with neither its bundle nor
# its folder on main is NOT published (the run fails and says so). Re-running is
# safe: a published release is no longer a draft, a pushed folder is not
# committed twice.
#
# GitHub pauses scheduled workflows after 60 days without repository activity.
# From day 50, while a kit is still waiting, each run warns on Discord.
#
# Repository secret (optional): DISCORD_WEBHOOK, for the release / failure post.

name: Release scheduled kits

on:
  schedule:
    - cron: '20 6-9 * * *'      # hourly 06:20-09:20 UTC: covers 08:00 Paris in summer and winter
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what is due and stop (no commit, no release change)'
        type: boolean
        default: true

permissions:
  contents: write               # push the kit folder, publish the release; nothing else

concurrency:
  group: release-kits
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Publish every draft kit whose release_at has passed
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run }}          # empty on scheduled runs = act
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tab="$(printf '\t')"
          now=$(date -u +%s)
          list="$RUNNER_TEMP/drafts.tsv"                  # outside the checkout: never committed
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft)
            | [.id, .tag_name, ((.body // "") | (try capture("release_at: (?<t>[^ ]+) -->").t catch ""))]
            | @tsv' | sort -t "$tab" -k3 > "$list"
          released=""
          failed=""
          waiting=""
          while IFS="$tab" read -r id tag at <&3; do
            [ -n "$at" ] || continue                      # not a scheduled kit: never touched
            if ! printf '%s' "$tag" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
              echo "::warning::draft $id has tag '$tag', which is not a kit slug: skipped"; continue
            fi
            # Strict ISO 8601 with an offset first: GNU date alone reads "next-tuesday" as a date.
            if ! printf '%s' "$at" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?([+-][0-9]{2}:[0-9]{2}|Z)$' \
               || ! due=$(date -u -d "$at" +%s 2>/dev/null); then
              echo "::warning::$tag has an unreadable release_at '$at': skipped"; continue
            fi
            if [ "$due" -gt "$now" ]; then
              echo "$tag waits for $at"; waiting="${waiting:-$tag at $at}"; continue
            fi
            if [ "$DRY" = "true" ]; then echo "DRY RUN: $tag is due ($at) and would be released"; continue; fi
            echo "::group::$tag (due $at)"
            asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" \
                    --jq '.[] | select(.name == "kit-src.tar.gz") | .id')
            if [ -n "$asset" ]; then
              tmp=$(mktemp -d)
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$tmp/kit.tgz"
              tar -xzf "$tmp/kit.tgz" -C "$tmp"
              test -d "$tmp/$tag" || { echo "::error::kit-src.tar.gz has no $tag/ folder"; exit 1; }
              rm -rf "./$tag"
              cp -r "$tmp/$tag" "./$tag"
              paths=("$tag")                              # only what this kit brings
              for f in README.md DATA_LICENSE.md CITATION.cff; do
                if [ -f "$tmp/_root/$f" ]; then cp "$tmp/_root/$f" "./$f"; paths+=("$f"); fi
              done
              git add -A -- "${paths[@]}"
              if ! git diff --cached --quiet; then
                git commit -m "Release the $tag kit"
                git push origin HEAD:main
              fi
              # Remove the source bundle before the release goes public.
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > /dev/null
            elif [ ! -d "./$tag" ]; then
              echo "::error::$tag is due, but its draft has no kit-src.tar.gz and main has no $tag/ folder: NOT published"
              failed="$failed $tag"
              echo "::endgroup::"
              continue
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false \
              -f tag_name="$tag" -f target_commitish=main -f make_latest=true > /dev/null
            page=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 release-kits' \
                   "https://learngeodata.eu/materials/$tag/" || true)
            echo "kit page answers HTTP $page"
            released="$released $tag(page:$page)"
            echo "::endgroup::"
          done 3< "$list"
          warn=""
          if [ -n "$waiting" ]; then
            idle=$(( (now - $(git log -1 --format=%ct)) / 86400 ))
            if [ "$idle" -ge 50 ]; then
              warn="No commit on main for $idle days and $waiting is still waiting: GitHub pauses this workflow at 60 days. Push any commit or re-enable it in the Actions tab."
              echo "::warning::$warn"
            fi
          fi
          {
            echo "released=${released# }"
            echo "failed=${failed# }"
            echo "warn=$warn"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then exit 1; fi

      - name: Tell Discord
        if: always() && (failure() || steps.rel.outputs.released != '' || steps.rel.outputs.warn != '')
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          RELEASED: ${{ steps.rel.outputs.released }}
          FAILED: ${{ steps.rel.outputs.failed }}
          WARN: ${{ steps.rel.outputs.warn }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$HOOK" ] || { echo "no DISCORD_WEBHOOK secret"; exit 0; }
          msg=""
          if [ "$STATUS" != "success" ]; then
            msg="GitHub kit release FAILED ($STATUS)${FAILED:+, not published: $FAILED}. Released anyway: ${RELEASED:-none}. Nothing is retried bigger; fix, then run the workflow by hand."
          elif [ -n "$RELEASED" ]; then
            msg="GitHub released: $RELEASED (a page code other than 200 means the WordPress side is late)"
          fi
          if [ -n "$WARN" ]; then msg="${msg:+$msg | }$WARN"; fi
          curl -s -H 'Content-Type: application/json' \
            -d "$(jq -n --arg c "$msg $RUN" '{content: $c, allowed_mentions: {parse: []}}')" "$HOOK" > /dev/null
